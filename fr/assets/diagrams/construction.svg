<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
<title id="title">Exemple synthétique de paroi</title><desc id="desc">Coupe de trois couches fictives : finition, noyau et isolant. Ne représente pas un bâtiment réel.</desc>
<defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#7a6236" stroke-width="1"/></pattern><pattern id="brick" width="36" height="20" patternUnits="userSpaceOnUse"><path d="M0 0H36M0 10H36M18 0V10M0 10V20" stroke="#713e30" fill="none"/></pattern></defs>
<rect x="1" y="1" width="718" height="268" rx="14" fill="#f5f7fa" stroke="#b7c4ce"/>
<g font-family="sans-serif" fill="#253746"><text x="28" y="29" font-size="16" font-weight="bold">Coupe conceptuelle · exemple synthétique</text><text x="28" y="59" font-size="12">Extérieur</text><text x="690" y="59" text-anchor="end" font-size="12">Intérieur</text>
<rect x="28" y="77" width="58" height="100" fill="#c7d1d8" stroke="#64748b"/><rect x="86" y="77" width="365" height="100" fill="#c8856e" stroke="#64748b"/><rect x="86" y="77" width="365" height="100" fill="url(#brick)"/><rect x="451" y="77" width="241" height="100" fill="#e5cc84" stroke="#64748b"/><rect x="451" y="77" width="241" height="100" fill="url(#hatch)"/>
<text x="57" y="132" text-anchor="middle" font-size="15">1</text><text x="268" y="132" text-anchor="middle" font-size="15">2</text><text x="571" y="132" text-anchor="middle" font-size="15">3</text>
<text x="28" y="207" font-size="14">1 · Finition</text><text x="270" y="207" font-size="14">2 · Noyau</text><text x="500" y="207" font-size="14">3 · Isolant</text><text x="28" y="246" font-size="12">Ordre et proportions illustratifs ; aucune mesure ni association de bâtiment réel.</text></g></svg>
